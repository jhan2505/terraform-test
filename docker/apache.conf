<VirtualHost *:80>
    DocumentRoot /home/developer/app/www
    ServerName localhost
    
    # Pasar variables de entorno a scripts CGI
    PassEnv DB_HOST
    PassEnv DB_PORT
    PassEnv DB_NAME
    PassEnv DB_USER
    PassEnv DB_PASS
    
    <Directory /home/developer/app/www>
        AllowOverride All
        Require all granted
        Options +ExecCGI
        AddHandler cgi-script .sh
    </Directory>
</VirtualHost>
